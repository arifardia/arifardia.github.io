<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2; url=https://arifard.vercel.app">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect to the library...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e14;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .library-container {
            position: relative;
            background: #1a1e24;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(82, 61, 33, 0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid #3d2e1f;
        }

        .book-aura {
            position: absolute;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(222,184,135,0.1) 0%, transparent 70%);
            animation: glow 3s ease-in-out infinite;
            pointer-events: none;
        }

        h1 {
            color: #dec9a6;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px rgba(222,184,135,0.3);
        }

        p {
            color: #b8a07e;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .progress-bar {
            height: 4px;
            background: #3d2e1f;
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #dec9a6 0%, #826644 100%);
            width: 100%;
            animation: progress 2s linear forwards;
        }

        .floating-book {
            width: 50px;
            height: 35px;
            background: #2a1f15;
            position: absolute;
            animation: float 4s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(222,184,135,0.3);
            border: 1px solid #826644;
        }

        .page-particle {
            position: absolute;
            width: 8px;
            height: 12px;
            background: #fff5e6;
            opacity: 0;
            animation: pageFloat 3s linear infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        @keyframes progress {
            0% { width: 100%; }
            100% { width: 0%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes pageFloat {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="library-container">
        <div class="book-aura"></div>
        <h1>📚 The Archive Awaits</h1>
        <p>Turning the pages to your destination...</p>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <p style="color: #826644; font-size: 0.9rem;">
            Redirecting in <span id="countdown">2</span> heartbeats
        </p>
    </div>

    <script>
        // Create floating books
        function createFloatingBooks() {
            const container = document.body;
            for(let i = 0; i < 5; i++) {
                const book = document.createElement('div');
                book.className = 'floating-book';
                book.style.left = Math.random() * 100 + '%';
                book.style.top = Math.random() * 100 + '%';
                book.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(book);
            }
        }

        // Create floating pages
        function createPages() {
            setInterval(() => {
                const page = document.createElement('div');
                page.className = 'page-particle';
                page.style.left = Math.random() * 100 + '%';
                document.body.appendChild(page);
                
                setTimeout(() => page.remove(), 3000);
            }, 500);
        }

        // Countdown timer
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        
        const updateCountdown = () => {
            seconds--;
            countdownElement.textContent = seconds;
            if(seconds <= 0) clearInterval(countdownTimer);
        }

        createFloatingBooks();
        createPages();
        const countdownTimer = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
